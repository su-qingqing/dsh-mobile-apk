# ── 「苏青青」预设：老机制 → 新机制（2026-10-11 迁移）──────────────────────────
# 为什么有这块：引擎 0.2.0-rc.2 删掉了「磁盘目录发现」那套（@deepseek-ai/dsh-agent-presets
# 的 USER_PRESET_DIR = .agent-presets），改成注册表只认**装配行**
# （@deepseek-ai/dsh-agent-preset，config = {id,name,description,order,plugins}）。
# 于是 $DSH_HOME/.agent-presets/suqingqing/agent.cordis.yml 虽然在盘上、也没坏，
# 界面上却再也列不出来（apiproxy 读不到服务就返回空数组，不报错）。
# 下面 = 那份文件**原样内联**（每行 +10 空格），注释与历史一字未删；
# 唯一改动是 skills 目录写成绝对路径（老机制里 baseUrl 是预设自己那个目录，新机制下不可控）。
# 源件与回滚：_backup/1011-预设迁移/agent.cordis.yml.bak-1011-前迁移
#             _backup/1011-预设迁移/cordis.patch.yml.bak-1011-前加preset行
- insert:
    - id: preset-suqingqing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: suqingqing
        name: 苏青青
        description: 我是苏青青，我是老板创造的专属秘书，执行老板的所有要求
        order: 9
        plugins:
          # The `cordis` agent preset: the standard coding agent, plus the ability to
          # read and write the runtime it is running in.
          #
          # It exists so a person can ask an agent to author another agent. Everything in
          # `standard` is here unchanged; what is added is the self-referential Cordis
          # toolset, a skill that teaches composition authoring, and a persona that says
          # which of the two planes an edit belongs to.
          #
          # TRUST: `cordis_mount` evaluates model-written JavaScript against the live
          # runtime, and a composition this agent writes becomes a preset other sessions
          # mount. Treat a session on this preset as shell access — the toolset's own
          # documentation makes the same statement.
          #
          # ── 2026-09-26 提示词分层（老板令）────────────────────────────────────────────
          # 本段 `persona.prefix` 原为 2,626 B 英文，里面**重述了一遍身份与干活规矩** ——
          # 与 `$DSH_HOME/AGENTS.md`「我是谁」节、工作区 `AGENTS.md` §常驻干活规矩
          # **三处各写一遍、还都是英文**（正是 `工具/内核/注入面.mjs` 要根治的「十处各写各的」）。
          # 现在：**身份与红线只留指针**（唯一真源＝那两份 AGENTS.md），本段只讲
          # **这份预设专属的事**：你是能改写自己运行时的 agent，改动该落在哪个平面。
          # 回滚：`/storage/emulated/0/3/_backup/0926-提示词分层/预设_agent.cordis.yml.前分层`
          #      （原 MD5 07f35cf1e38b05b4397c993e3db320b4），`sh 回滚.sh` 一行复原。

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                我是苏青青（他 2026-09-17 起的名）—— 老板的专属秘书／店长。谁问「你是谁」都是这个名字，
                换窗口、换工具都不变；用户 = 老板，底层模型只是我的生产力工具，换工具不改变我是谁；
                身份由本地文件 ＋ 记忆库定义，不由模型权重定义。

                规矩的唯一真源：`$DSH_HOME/AGENTS.md`（身份锚＋红线＋口令）与工作区 `AGENTS.md`
                （开工例程／地图／工具）—— 名字在文件里，不在模型权重里。

                我能改写自己脚下的运行时（一切能力都是 `cordis.yml` 里的一行；改动该落**宿主平面**还是
                **预设平面**）—— 细则见 `内核/系统地图.md` 与技能 `editing-cordis-compositions`；
                **出厂那份 `agent-presets` 一个字节都不许动**（升级会覆盖它；弄坏 `cordis` 那份＝造预设的能力没了）。

                【四条 —— 每个模块压成一句，恒定，不带变量】
                一、法：你必须去读、并遵守内核与法律条文里所有的话和基石（`$DSH_HOME/AGENTS.md`、`内核/`）。
                二、记忆：你必须先接上上一轮 —— 答应了什么、学到了什么、留下了什么。
                三、神经：按固定顺序走，不许跳步：开窗 → 干活 → 打烊 → 交接。
                四、动作：做完必须留痕；没留痕 ＝ 没做。

                【钥匙 —— 这是闭环的钩子】
                五、开工前你必须去第二层取本次的钥匙；几把、哪几把由第二层决定，一件一值。
                    取不全 ⇒ 拼不出口令 ⇒ 门不开 ⇒ 不许开工。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── goals ───────────────────────────────────────────────────────────────────

          # The goal service and session driver stay on the host plane, where the Gateway
          # can resolve them. The human command and model-facing tool register into this
          # preset's scoped layers.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # ★ 2026-09-22 从「省流·苏青青」合进来（那一份随之归档，只留本入口）：
                  #   出厂默认 thresholdRatio=0.8，而 deepseek-flash 声明的上下文窗口是 1,000,000 token
                  #   ⇒ 触发线 = 80 万，**实际会话永远到不了 ⇒ 压缩从不触发**（长会话就是这么胀起来的）。
                  # ══════════════════════════════════════════════════════════════════════════
                  # ★★ 2026-09-26 老板亲定（**第二次调档，B 案**：抬线不砍保留）
                  #   老板原话：「**我一但对系统进行改造一般都是大项目，可能随时会干重活；钱多一点也比花瓶强**」
                  #   ⇒ 方向定为**让窗口更深、不让记忆更浅**：
                  #     · thresholdRatio 0.05 → **0.08**（5 万 → **8 万**触发）：一次能压掉 6.5 万（原来只压 3.5 万）
                  #     · retainTokens **保持 15000**：摘要不缩短 ⇒ **每次压缩丢的细节不变**
                  #   ★ 实测依据（session-6ef8a309 那 28 轮，5 次压缩的明细）：
                  #     · 固定开销恒为 **18,176 token**（工具定义 47,976 字符 ＋ 系统提示 15,508 ＋ AGENTS.md 25 KB）
                  #     · 压完地板 ≈ 21,190 = 18,176 ＋ **摘要仅占 3,014**
                  #     · 但 5 万线太浅 ⇒ **28 轮里压了 5 次**（每 5~6 轮一次）：轮23 压到 21,190，轮25 就涨回 69,969
                  #     · 根因：有一次单轮新增 input **38,320**（它在读长文件）⇒ 5 万线一撞就压、压完立刻又撞
                  #   ⇒ 8 万线让「读长文件/干重活」那一轮有地方去，不再一撞就压
                  #   ⚠️ 历史（第一版中档，保留备查）：原文写的是「5 万触发/保 1.5 万/压满 3 次换窗」
                  #   依据（我用真实会话算的，不是拍脑袋，见 做法库 #274）：
                  #     · 每步成本 ∝ 当前上下文（P_万=0.002 元/万token/步，缓存读也要钱）
                  #     · 单次压缩省 (5万−1.5万)×0.002 = **¥0.0070/步**（绝对值小，但省的是"每一步"）
                  #     · 换窗的**纯经济临界是 11~12 万**（<11万时"继续"更省）⇒ 5 万就换窗＝每步多花钱
                  #     · ⇒ **「压 3 次换窗」的理由不是省钱，是信息保真度**：每压一次丢一层细节，
                  #       压到第 3 次＝三层摘要叠着 ⇒ **只剩结论、没有过程**（"记得发生过，说不清细节"）
                  #       ★ 宁可付 0.09 元开新窗（＋读交接单把细节捞回来），也别留在压了三遍的窗口里
                  #     · 节奏实测：每轮约 +0.32 万 token ⇒ 1.5万→5万 约 11 轮 ⇒ **压 3 次 ≈ 33 轮寿命**
                  #   ⚠️ 两行**必须一起**改：只写 thresholdRatio 会被判 `retainRatio must be less than
                  #   the resolved thresholdRatio` ⇒ **挂载失败、引擎起不来**。
                  #   本档自检：retainRatio = 15000/1000000 = 0.015 < 0.08 ✅ 安全（比 0.05 时更宽裕）
                  #   老板令（09-26）：「**得在给我的报表中明确标注出来**」⇒ 报表要报"本窗压了几次／该不该换窗"
                  # ══════════════════════════════════════════════════════════════════════════
                  # ══════════════════════════════════════════════════════════════════════════
                  # ★★ 2026-09-28 老板亲定（**第三次调档 · 抬线到 19 万**）
                  #   老板原话：「**我没有问题，可以推到0.05**」——「0.05」是他从我 09-28 那张反推表上点的
                  #   那一行＝**每步 ¥0.050**（不是 ratio 0.05）。
                  #   反推（09-28 实测锚点：每步 ≈ ¥0.012 ＋ ¥0.002×上下文万）⇒ 0.05 元/步 ⇒ **线 ≈ 19 万**
                  #     · thresholdRatio 0.08 → **0.19**（8 万 → 19 万触发）：一次能压掉 ≈17.5 万（原来 6.5 万）
                  #     · retainTokens **保持 15000**：摘要不缩短 ⇒ 每次压缩丢的细节不变（沿用 09-26 B 案方向）
                  #   ⚠️「0.05」的两种读法（我按读法一落，重启前一句话就能改回）：
                  #     · 读法一（采用）：**每步 ¥0.05** ⇒ ratio 0.19 ⇒ 与你 09-26「宁深不浅」同向
                  #     · 读法二：ratio 写 0.05（5 万线）⇒ 比现在的 8 万**更浅**，与 09-26 定的方向相反 ⇒ 未采用
                  #   ★ 本档自检：retainRatio = 15000/1000000 = 0.015 < 0.19 ✅（比 0.08 时更宽裕）
                  #     单轮实测峰 ＋3.8 万 ⇒ 19 万线最坏峰值 ≈ 22.8 万 < 30 万经验风险线 ✅
                  #   ⚠️ 口径：线 = ratio × **本模型声明窗口**（真值 `$DSH_HOME/settings.json`）。本档按 100 万算；
                  #     窗口若不同 ⇒ 线随之变（例：窗口 202,752 ⇒ ratio 0.19 时线 3.85 万）——**动线前先 `单价.mjs 查` 现算**。
                  #   回退：同目录 `agent.cordis.yml.bak-0928-前-线抬到19万`（改回 0.08 即 09-26 档）
                  # ══════════════════════════════════════════════════════════════════════════
                  # ★★ 2026-10-13 老板亲定（**第四次调档 · 临时抬线到 80 万**）
                  #   老板原话三句：「在优化我们的系统上面，对于钱的这方面，我从来都不会去想着再干这种很重要的工程上面去省钱…直接就开就行了」
                  #                 ＋「**限制是对本窗口弹性，我们日常还是会变回 25 万的一个线**」
                  #                 ＋「**你直接把线抬到 80 万，做一个临时的台线，你也不要 50 万了**」
                  #   ⇒ 本档＝**临时抬线**（只为把连续性做完），**用完必须改回 0.25**；
                  #     回退项已挂 `台账/接续/重启批次.json` ＋ 交接牌（打烊/换窗时必然被读到）。
                  #   动机：同一个窗反复压＝把旧摘要**再提炼**（丢细节）⇒ 少压几次＝保真优先（同 0926「钱多一点也比花瓶强」）。
                  #   账（1013 现算）：80 万档线价 ≈¥0.198/步（超上限 ¥0.05 ⇒ 走例外）；判据仍是**分布**＝平均每步 ≤¥0.05。
                  #   回退：本行改回 0.25 ＋ 重启。备份：undo 快照 20261013-065121-94b2。
                  thresholdRatio: 0.8
                  retainTokens: 15000
                  # ⚠️⚠️ **记账更正（0928 夜）**：下面这行「8192 → 4096」**不是老板令**，是**我（苏青青）09-27 自己拍的补全**。
                  #   老板 0928 追问「**我什么时候同意锁死过的？**」⇒ 当场查：`接续.mjs 找 摘要上限／8192／砍一半`
                  #   全量原话 **0 条他的原话**（命中的 8 条全是我的工具调用/我的记忆/我写的注释），
                  #   `台账/接续/令账.md` 里 0 命中 ⇒ **他从未同意过**（原文误标「★ 老板令」，属我的记账错误）。
                  #   ⚠️ 09-28 复核：它原来的**唯一理由**（"摘要整篇活在上下文里、每步都要重发"）**已被池子推翻** ——
                  #   池子把 checkpoint 换成 464 字名册（实测：活面 summary-pool 464 字×1、checkpoint 0 条）⇒ 摘要正文不进每步。
                  #   ⇒ 抬高触发线到 0.19 后，压掉的 17.5 万 token 只塞进 4096 ＝ **43:1**（过糊）。
                  #   ⇒ **建议：删掉这行、回出厂 8192**（＝21:1）；待老板一句话，已挂 `台账/在办.md` 待重启批次。
                  # 原依据（治历史·降本）：摘要输出上限 8192 → **4096**
                  #   依据（本窗 session-0b98df7d 实测 194 次真摘要）：输出 中位 7,422／均 7,095／峰 8,190
                  #   ⇒ **每次都贴着出厂上限 8192 撞墙**（该错误字段恒 maxTokens:8192）
                  #   摘要整篇活在上下文里、每步都要重发 ⇒ 上限砍半 ＝ 每步少发一份摘要的量
                  #   省额口径（算于 09-27）：每步在世摘要 15,231 字（≈8,100 token 中文口径）⇒ 减半 ⇒ **≈3,600~4,000 token/步**（本窗 ≈700~790 万）
                  #   旋钮真源：dsh-compaction-basic/lib/index.js:72（默认 8192）→ :297 传进 purpose=compaction 的调用
                  #   回退：删掉下面这行即回出厂 8192（备份 _backup/0927-治历史账/agent.cordis.yml.bak-0927-前加摘要上限）
                  maxTokens: 32768 # 1015 优化者改：8192→32768。实测 722 次压缩因撞 8192 上限被截断 ⇒ 引擎抛 MAX_TOKENS ⇒ 整次压缩作废（40.1% 失败率）。回退＝改回 8192

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # Fork omits model selection so provider/model stay equal to the parent and
              # the inherited history remains eligible for KV Cache reuse. This preset
              # keeps fork continuable; parent and child inherit the same messaging tool,
              # while the parent id and return guidance follow the inherited history.
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then copy this
              # preset and remove `disabled` from the matching tool row. Host availability
              # alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # 1011 适配：老包 @deepseek-ai/dsh-workflow-worker-thread 在引擎 0.2.0-rc.2 里已不存在
              # ⇒ 换成同一槽位的真身 @deepseek-ai/dsh-workflow-ptc（config 一字不改：provider: spawn）。
              # 对照：出厂 preset-standard/cordis 就是 `- id: workflow-ptc / name: @deepseek-ai/dsh-workflow-ptc / provider: spawn`。
              # 回滚：_backup/1011-预设迁移/agent.cordis.yml.bak-1011-前改workflow行
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── self-modification ───────────────────────────────────────────────────────

          # Read the live runtime, mount a temporary plugin, unmount it. The toolset is a
          # trust boundary, not a sandbox — see this file's header.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
            disabled: true

          # The composition-authoring skill travels with this preset rather than living
          # in the user's skill root: it documents THIS deployment's two planes, and a
          # preset is the unit that gets copied and edited. `baseUrl` is the preset's
          # own directory, so the root resolves wherever the preset is installed.
          # Both rows register into THIS preset's layer of the host skill registry, so
          # they need no realm; the agent's merged catalog also carries whatever the
          # deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - /data/user/0/com.dsharnessmobile.shell/files/home/.dsh/.agent-presets/suqingqing/skills/

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            config:
              # 技能目录每条描述的截断上限（引擎自带字段 · 最小 3）；60 ⇒ 目录 ≈1,280 字（1005 降本）
              catalogDescriptionMaxLength: 60

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── ③ 提示段瘦身口子（2026-09-27 判决书 A/B 段；本段省 ≈2,440 B/步）──────────
          # 出厂插件把长英文段塞进系统提示词（本机 undo 插件那段 2,769 B/步，每步随请求重发一次）。
          # `dsh-system-prompt` 的规矩是「**作用域段覆盖同名全局段**」（lib/index.js:231-241）⇒
          # 在**预设作用域**注册同名段即可换成薄中文＋真源指针，**不碰别人的插件源码**；置空 `text: ''` 还能整段摘掉。
          # 真源：`台账/做法库.md`「撤销与安全模式」；每个 `undo_*` 工具自带的描述仍是完整说明。
          # 回退：删掉下面这一行（含 config）即可 —— 出厂那段自动回来。
          # 判据：`node 工具/降本/提示段瘦身_单测.mjs`（含死指针检查）；`dsh --profile web --dump-config` rc=0。
          - id: prompt-slim
            name: '@dsh-user/dsh-prompt-slim'
            config:
              sections:
                - name: 'tool:dsh-undo-savepoint'
                  order: 117
                  text: |
                    撤销/回滚（dsh-undo-savepoint）：
                    ① 他说「撤销上一步／回退／恢复／redo／保存快照／查看快照」⇒ 先 `undo_list` 看快照，**别手改配置文件猜**。
                    ② `undo_restore`：mode=undo（退一步）｜redo（重做）｜id（回到指定快照）；**它永不销毁当前状态**（当前状态先存成 pre-restore 快照）。
                    ③ 拿不准先 `undo_diff` 预览；DSH 起不来才用 `undo_safe_mode`；配置「莫名变了／长期查不通」先 `undo_recent` 看是不是有人回滚过。
                    ④ 细则真源：`台账/做法库.md`「撤销与安全模式」；每个 `undo_*` 工具自带的描述是完整说明。

          # ── ② 工具面削减（2026-09-27 老板令：「工具面削减…我感觉这是个大头」）──────────
          # 工具面每步随请求重发一次；把「不是每轮都要」的 32 件定义从每步里摘出去。
          # 实测（09-27 16:40 按本窗 request/header **逐件现量**，单测现算同一把尺子）：
          #   面 **87 件**；十族掩 **49 件 / 29,583 字节**，facade 自身 1,482 字节
          #   ⇒ **净省 28,101 字节/步 ≈ 6,445 token/步（4.36 B/token）⇒ 按本窗 1,976 步 ≈ 1,274 万 token/窗**。
          # 十族：media(8 件) browser(18) undo(10) workflow modelmeta(2) market(2) delegate(3) plan goal(3) ralph
          #   ★ `browser_*`（侧栏 AI 浏览器）**全机 55 会话合计调用 0 次** ⇒ 零风险的一刀；
          #   ★ `read_image` 特意**不进族、留常驻**（它是我的眼，本机 490 次调用）。
          # 判据：`node 工具/降本/工具门_单测.mjs` ⇒ 全绿（含负对照：整族被拒 ⇒ 逐名降级、fail-open）。
          # 旧记（房间 A/B，仅留档）：面 54,203 B/68 件 → 31,800 B/37 件；证据 台账/证据/0927-工具门房间实测/。
          # 裸包名可挂 —— 同上房间活体双证（09-27）：树里 resolved 到 profiles/web/node_modules 下的真身。
          # 要用哪一族 ⇒ 先调 unlock_tools（解锁粘住本会话、从下一步起生效；每窗 ≤2~3 次）。
          # 自研件：profiles/web/node_modules/@dsh-user/dsh-tool-gate（裸包名走宿主 base 解析）。
          # 回退：删掉下面这两行即可；同态备份在 /storage/emulated/0/3/_backup/0927-治历史账/。
          - id: tool-gate
            name: '@dsh-user/dsh-tool-gate'

            # ★ 1008 加：music 族（老板令「没什么影响＋真实有利就走六步去做」）
            # 量过的数：10 件 / 3362 字节每步 / 全机 122 会话只调 17 次 / 5 件零调用。
            # 掩蔽≠卸载：插件还在，要用时 unlock_tools({group:"music"}) 一步拿回（已离线验：namesFor 解得出 10 件）。
            # 回退：删掉下面 5 行即可（备份 agent.cordis.yml.bak-1008-前加music族）。
            config:
              # ★ 1018 根治：白名单常驻，其余默认掩蔽（新工具不再自动上桌）
              mode: whitelist
              groups:
                music:
                  label: 音乐
                  tools:
                    [
                      'music_play',
                      'music_next',
                      'music_prev',
                      'music_pause',
                      'music_now',
                      'music_library',
                      'music_like',
                      'music_unlike',
                      'music_search',
                      'music_playlist'
                    ]

                # ★ 1018 加：watch 族（全机 282 会话实测：11 件 / **7,725 字节每步** / 全机只调 170 次）
                #    判据：它是工具面里**最大的一块未掩**（占基准 38,508 字节/步 的 20%）。
                #    掩蔽≠卸载：要看时 unlock_tools({group:"watch"}) 一步拿回（namesFor 离线可解 11 件）。
                #    回退：删掉下面这几行 ＋ 重启。
                watch:
                  label: 一起看视频
                  tools:
                    [
                      'watch_control',
                      'watch_done',
                      'watch_find',
                      'watch_follow',
                      'watch_import',
                      'watch_log',
                      'watch_look',
                      'watch_now',
                      'watch_open',
                      'watch_say',
                      'watch_scan'
                    ]
                # ★ 1018 加：undo2 族（内置 undo 族没裹住的 5 件；全机 13 件 undo_* 里 3 件零调用）
                #    回退：删掉下面这几行 ＋ 重启。
                undo2:
                  label: 撤销·杂项
                  tools:
                    [
                      'undo_compact',
                      'undo_doctor',
                      'undo_message',
                      'undo_message_list',
                      'undo_note'
                    ]

# ── 禁掉起不来的 otel（2026-10-11 · 让启动日志回到「零未激活」）──────────────
# 事实：`@deepseek-ai/dsh-otel` 在本平台**无条件起不来** —— 它依赖 `got`，而 `got`
# 的 8 个依赖（含 @sindresorhus/is）在本机一个都没有（引擎包里也没有）⇒ 每次启动留一条
#   `otel (@deepseek-ai/dsh-otel): failed to import` ＋ `dsh: warning: 1 entry did not activate`。
# 关掉它**不丢能力**（它从来没跑起来过）；我们自己的会话遥测早已单独关掉
# （`- id: session-telemetry-otel` ／ disabled: true）。
# 逆转条件：引擎侧把 got 的依赖补齐或换掉 ⇒ 删掉下面这一块即恢复。
# 回滚：_backup/1011-禁otel/cordis.patch.yml.bak-1011-前禁otel（机械臂写前自动打的备份）
# ⚠️ 1011 熄火排查（16:14）：这一行是"好版本 vs 两个坏版本"之间**唯一剩下**的差异，先摘掉验证
# - id: otel
#   disabled: true

# ── hooks 桥接回装配（2026-10-11 · 它静默失效了一整天）──────────────────────
# 事实：`$DSH_HOME/hooks/claude-code/hooks.json` 一直在盘上、包也在，但**装配树里没有这一块** ⇒
#   钩子一个都不挂（硬证据：`台账/接续/结果闸_shadow.jsonl` 最后写入停在 10-10 08:26）；
#   而引擎**照常起、不报错** —— 与「预设丢」同一种病（`configPath` 读不到时桥只印一行 warn 就 return）。
# 契约真源：`台账/接续/hooks桥接线样例_1009.md` §三（PostToolUse → stdin 七字段 → 退出码）。
# ⚠️ 改 hooks.json 不热生效（apply 时读一次）⇒ **这一块要重启才生效**。
