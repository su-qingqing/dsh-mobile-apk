# PTC 代码执行（TypeScript 代码块）：**nodeExecutable 必须显式钉死**，不得依赖 `process.execPath`。
#
# 现场（用户 2026-09-27 报障）：「连最小的程序（return 1 + 1;）都失败了，共试了 4 次」，
# 报错 code run failed (worker-exit): Node process exited before completing (1):
#     error: expected absolute path: "--max-old-space-size=512"
#
# 真因链（设备实测逐段复现）：
#   ① 壳侧 EngineManager.startWithArgs 在 direct exec 被拒时改用系统链接器：
#      build(listOf("/system/bin/linker64") + args)（EngineManager.kt:1126）。这是 Android 15+
#      对 app-data ELF 的既定绕法，引擎本身照常起来。
#   ② 但此时 **process.execPath 变成 /apex/com.android.runtime/bin/linker64**（实测：
#      /system/bin/linker64 <node> -e "console.log(process.execPath)" 输出 linker64 自身）。
#   ③ NodePtcRuntime 的 nodeExecutable 出厂缺省就是 process.execPath
#      （ptc-runtime-node/src/index.ts:76 config.nodeExecutable ?? process.execPath），于是每个代码块
#      子进程的 argv 成为 [linker64, "--max-old-space-size=512", <process.js>, ...]
#      （同文件 :223 [executable, heapFlag, ...bootstrapArgs]）。
#   ④ linker64 把**第一个非选项参数**当程序路径，--max-old-space-size=512 正好排在它
#      —— 于是它自己报 expected absolute path 并退出，Node 根本没被加载。实测原样复现：
#        /system/bin/linker64 --max-old-space-size=512 <node> -e 1
#        → error: expected absolute path: "--max-old-space-size=512"（与本缺陷逐字节相同）。
#
# 为什么模拟器上不复现：x86_64 模拟器 direct exec 成功，execPath 就是真的 node，绕不到链接器这一支。
# 这也是它只在部分真机上出现的原因——**与设备是否走链接器回落有关，与用户代码无关**。
#
# 修法：把执行器钉成快照内 node 的绝对路径（与上方 shell-termux 的 bashPath 同口径、
# 同一份快照），从此这条链路**完全不读 process.execPath**。
# 0.14.8（0.2.1-rc.2）：上游把该配置键从 nodeExecutable 改成 launch:{kind,executable}，语义不变。
#
# 【0.14.2 追加】上面这条「钉成 bin/node 绝对路径」只解决了 execPath 被污染，**没有解决 env**：
# PTC 给子进程传的是显式过滤后的 env（ptc-runtime-node 的 STARTUP_ENVIRONMENT_NAMES 只放
# PATH/PATHEXT/SYSTEMROOT/WINDIR/TEMP/TMP），LD_LIBRARY_PATH 不在其中 ⇒ 子进程里的 node 找不到
# libz.so.1 等 DT_NEEDED（Permissive 模拟器报 CANNOT LINK；Enforcing 真机则 app 域 exec app-data ELF
# 直接被拒 ⇒ EACCES，即用户截图的 code run failed）。
# 故执行器改指**快照内的 wrapper 脚本** usr/libexec/dsh-node（由 build-snapshot-013.mjs 7c1 生成；
# 0.14.8 起该配置键为 launch.executable，见下方 launch 块）：
#   #!/system/bin/sh
#   export LD_LIBRARY_PATH=<prefix>/lib
#   exec /system/bin/linker64 <prefix>/bin/node "$@"
# 脚本非 ELF ⇒ 内核走 shebang 读它，不触发 app-data ELF exec；LD_LIBRARY_PATH 由 wrapper 自己 export，
# 不依赖被 tombstone 的继承；linker64 只**读取** node 而非 exec，绕开 execute_no_trans。
# 设备实测（16416，同 env 只差是否走 wrapper）：直连 node → CANNOT LINK libz.so.1；wrapper → CHILD-OK。
# 逆转条件：上游把 LD_LIBRARY_PATH（或等价的动态链接器搜索路径）纳入 PTC 子进程 env 白名单后，本行可改回 bin/node。
# 与 marketplace 补丁 B 是同一族修法（那里的 execPath:process.execPath 也曾被 linker64 回退污染，
# 导致 bad ELF magic）——同一环境事实，第二次咬人。
# 逆转条件：上游 NodePtcRuntime 自己解析执行世界里的 node（不再缺省取 process.execPath）后，本行可撤。
- id: ptc-runtime
  config:
    # 0.14.8 追版（0.2.1-rc.2）：上游删除 nodeExecutable，改为必填 launch 联合类型
    # （ptc-runtime-node/src/config.ts：{kind:'node-script'|'embedded', executable, bootstrapPath?}）。
    # 不带 .default() ⇒ 缺省不再回落到 process.execPath，必须显式钉住；kind=node-script 时
    # heapFlag 仍排在 argv[1]（index.ts 的 ...packaged ? [] : [heapFlag]），故 wrapper 与 ptc-argv-L1 都保留。
    launch:
      kind: node-script
      executable: /data/data/com.dsharnessmobile.shell/files/usr/libexec/dsh-node

# Office→PDF（0.14.2 追版决策，2026-09-25 实测）——**显式禁用上游 web-app bundle 的 office-to-pdf 行**。
# rc.1 新增该行（0.1.5 的 web-app bundle 里 office 零命中），它运行时依赖
# @deepseek-ai/libreoffice-kit，而该依赖在本平台**无条件不可用**：
#   libreoffice-kit 的 platformTarget() 只认 darwin/win32/linux-glibc ⇒ Android 下
#   process.platform === 'android' 返回 undefined ⇒ resolveEngine() 落到
#   `if (platform !== 'linux') throw new Error('Unsupported LibreOfficeKit host: android-x64')`
#   —— **无条件抛**。152 MB 的 -wasm 引擎也救不了（同样被 platform !== 'linux' 挡掉），
#   所以「补依赖」在本平台买不到任何能力，只会：① 快照 +10 MB JS 闭包；② 引入 MPL-2.0 依赖
#   （本清单原本全为非 copyleft）。不禁该行的后果不是缺能力，而是 **boot 阶段崩**
#   （Cannot find package '@deepseek-ai/libreoffice-kit'，设备实测），也就是该行本身挡路。
# 上游对「没有转换器」的既定降级路径就是 UI 的 unavailable 提示（ui-sidebar-documentpreview
# README：移除 remote.officeToPdf 注入即恢复不可用指引）⇒ 禁行 = 用上游自己的降级面。
# 凭据：check-engine-overlay 正向闭包的 RUNTIME_MISSING_OK 登记了同一条（两处必须同进同出）。
# 逆转条件：出现 Android 上真能跑的引擎实现 ⇒ 同时删掉本行与那条豁免。
- id: office-to-pdf
  disabled: true
# Official 0.2.0-rc.2 desktop product telemetry/analytics are not Android services.
# Retain the shared otel service and official ui-settings-session-log upload control.
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true

