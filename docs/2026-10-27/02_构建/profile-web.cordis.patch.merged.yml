# 只换够长且缩得动的（≥2000B、缩≥50%、且带 <compacted-summary> 框标签），认不出就原样放行（fail-open）。
# ★判据：$DSH_HOME/summary-pool.log 出现「换：摘要-…」＋ 注入计量绝对值下降；★回退：删这两行再重启。
