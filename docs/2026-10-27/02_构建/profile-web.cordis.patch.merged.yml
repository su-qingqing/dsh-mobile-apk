# ── 一起看视频（2026-10-14 装机：@dsh-user/dsh-watch）──────────────────────────────
# 干什么：互联网的片子在 harness 里播 —— 宿主代理 B站直链（补 Referer/UA + 转发 Range，
#   所以进度条能拖），agent 用 watch_say / watch_import 把字幕推到画面底部浮层，
#   页面每 2 秒回报播放位置；看完 watch_done 落一条账（$DSH_HOME/watch-log.jsonl|.md）。
# 依赖：@dsh-user/dsh-media 的 media.py 新增 playurl 子命令（同批装，它负责把 BV 换成直链）。
# 回退：删掉下面这一块 ＋ 重启（包体留在 node_modules 不挂载 = 等于退役）。
- insert:
    - id: watch
      name: '@dsh-user/dsh-watch'

# ── 本窗花了多少钱（2026-10-14 晚装机：@dsh-user/dsh-cost）─────────────────────────
# 老板原话：「平板端不能获取到我真实的算力使用情况、我的 API 用量和我账户的一个数据，
#   找到能直接报本窗花了多少钱的仪器。」
# 干什么：cost_now 工具报 —— ① provider 报的真实 token 四桶（未命中输入/缓存命中/缓存写入/输出）
#   ＋缓存命中率；② 按官方价目表折算成钱（逐次调用判高峰/空闲时段）；③ 官方 /user/balance 的
#   账户余额（充值＋赠金）与本窗开始时的余额变化。
# 数据来源（查证过）：用量＝@deepseek-ai/dsh-token-meter 的 tokenUsage 投影 / 会话事件里的
#   provider usage；价格＝本插件内置的官方价目表（2026-10-14 抓取 api-docs.deepseek.com），
#   可被 $DSH_HOME/cost-prices.json 覆盖；余额＝https://api.deepseek.com/user/balance。
# 回退：删掉下面这一块 ＋ 重启（包体留在 node_modules 不挂载 = 等于退役）。
- insert:
    - id: cost
      name: '@dsh-user/dsh-cost'
# ── 义务结算 · 常驻件（2026-10-15 · 优化者按老板令「把需要靠她自己的事变成程序级别」装机）──
# 为什么存在：93 个动作点里判「活」的 34 个，其中 **19 件「有触发、没有③层强制挂点」** —— 触发只印一行
#   提醒，**不产生回执、缺了不阻断** ⇒ 仍然靠「我想起来」执行；而判它「靠自觉」的判据本身就是**手写的文字
#   快照**（`工具/台账/挂点体检.mjs:442` 按「依据」文字匹配，`台账/接续/挂点体检.md:126` 自认）。
#   她自己写的天花板（`工具/内核/结果闸.mjs` 抬头）：spawn 一个 node 进程 **0.44 秒/次**，且计数**无锁**
#   ⇒ 原文「要达标得走**常驻（宿主内钩子）**，不是把小脚本再瘦一圈」。
# 干什么：① `tools/post-execute` **引擎侧内存采集**痕迹（零 spawn、零子进程）；
#   ② `agent/turn-stopping` 读声明 `$DSH_HOME/obligations/义务.json`（**她的地盘、每轮热读、
#      改完当轮生效、不用重启**）算「应做／已做／欠」；
#   ③ 回执落 `$DSH_HOME/obligations/回执.jsonl` ＋ 人读一屏 `当前.md`（消费者：老板 ／ 下一轮的她）。
# ★★ 本件**一个字都不注入**（v4 · 2026-10-15）：不 steer、不进提示词。强度=拦 只记「本该拦」的账。
#   删因有量尺背书：轮末 steer ＝ 轮中注入 user 消息，是那天唯一新变量；而她的思考链同日出现
#   **全量 120 窗口 / 17,273 段思考里唯一一次**塌缩（30370 字、24 字片断重复 ×193）。
#   量尺可重跑：`node $HOME/.tmp/扫塌.mjs "$HOME/.dsh/sessions" 50`。
# ★判据：`$DSH_HOME/obligations/回执.jsonl` 每轮涨一行 ＋ `obligations.log` 出现「结算 …」。
# ★回退：删掉下面这一块 ＋ 重启（包体留在 node_modules 不挂载 = 等于退役）。
- insert:
    - id: obligations
      name: '@dsh-user/dsh-obligations'
      config:
        工作区: /storage/emulated/0/3
        开日志: true
        注入: steer

