# Default model（0.13.0 C3 端点级实锤修正，2026-08-25）：此前 pin 到 opencode-go
# （OpenCode Zen Go，opencode.ai/zen/go/v1）——该网关实测对无有效 key 请求返回扁平
# 404（"Not found"），且用户误以为在配 OpenRouter、实际请求发去 Zen Go → 全模型 404、
# 换 key 无用（openclaw #69898 / opencode #31041 同源撞车）。0.13.0 默认改回 dsh 官方
# deepseek-official：壳 shellEnv() 已注入 DEEPSEEK_API_KEY（files/deepseek-key.txt 私有文件），
# 零额外配置、国内可达、开箱即用。opencode-go 仍在「添加自定义供应商」列表中可选。
# 设置界面 agent-default-model 段为用户级（UI 保存会覆盖此默认）。
#
# 写法（0.14.2-fx-2 修正，2026-09-28）：**就地按上游 id 覆盖 config**，不再 disable + 换 id insert。
# 机制依据：cordis-plugin-include 的 applyEntryPatches 对无 insert 的 patch 走「按 id 找既有 entry
# 并逐字段覆盖」（vendor/include/src/index.ts:109-123）⇒ config 可直接打在既有行上。注意 config 是
# **整体替换不是深合并**（实测 {a,b} 打 {b} 只剩 {b}），所以 provider 与 model 两个键都要给全。
#
# 为什么改（现象→原因→影响面）：旧写法禁掉上游 agent-default-model 再用新 id `agent-default-model-mobile`
# 重新 insert 同一个包，只为塞一份 config。后果是**引入了一个服务供给单点**：session-controller 的 inject
# 依赖里有 agentDefaultModel，一旦这条自定义 id 的 entry 未激活（pending），session-controller 就跟着
# pending ⇒ boot 仍报成功（它不在上游 requiredStartupEntryIds 的 7 个 id 内）但 ctx.sessionController 缺席，
# 任何 session/selectModel 派发都得到 `active Service "sessionController" is unavailable`。
# 已知且有意的行为变更：live entry id 由 `agent-default-model-mobile` 变回上游的 `agent-default-model`。
# settings 的 namespace **就是 entry.options.id**（packages/settings/settings/src/index.ts:315/326/382），
# 因此**旧 `agent-default-model-mobile` namespace 里存过的「默认模型」值会读不到**，回落为本行 pin 的
# deepseek-official / deepseek-v4-flash。影响面：仅限在设置界面显式改过默认模型的用户，且只影响「默认模型」
# 一项（不涉及其它 settings 段）；改回设置界面重选一次即可。这是为消除单点而接受的代价。

# ═══════════════════════════════════════════════════════════════════════════
# 【回灌 · 边界1】agent-default-model 用真机版：含 reasoningEffort: max
# ═══════════════════════════════════════════════════════════════════════════
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max

