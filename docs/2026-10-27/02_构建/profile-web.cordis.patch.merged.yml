# 摘要池（降本 · 老板 2026-09-27 令「做个池子，然后按需发送」）：把每步原样重发的那块压缩摘要，
# 换成「名册（段标题＋字节＋取法）＋全文落池子、要用再取」。挂 agent/pre-step，在**记录层**用 surface replace
# 把那条检查点换成名册 —— 请求＝记录的纯函数，记录改了请求自然跟着改；**请求期偷换是禁区**（请求被 deepFreeze，
