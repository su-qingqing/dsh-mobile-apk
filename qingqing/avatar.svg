<svg width="460" height="460" viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 清晨天光：暖色从中心散开 -->
    <radialGradient id="dawn" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="38%" stop-color="#F5B971" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E3B36" stop-opacity="0"/>
    </radialGradient>
    <!-- 近山 -->
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57B894"/>
      <stop offset="100%" stop-color="#1C5C48"/>
    </linearGradient>
    <!-- 远山 -->
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B6E"/>
      <stop offset="100%" stop-color="#123F35"/>
    </linearGradient>
  </defs>

  <!-- 底色：深青 -->
  <rect width="460" height="460" fill="#0E3B36"/>

  <!-- 晨光 -->
  <rect width="460" height="460" fill="url(#dawn)"/>

  <!-- 太阳 -->
  <circle cx="230" cy="188" r="64" fill="#FFF3C4"/>
  <circle cx="230" cy="188" r="64" fill="none" stroke="#FFE9A8" stroke-width="6" opacity="0.5"/>

  <!-- 远山 -->
  <path d="M0 330 Q110 250 220 300 T460 285 V460 H0 Z" fill="url(#hillB)"/>

  <!-- 近山 -->
  <path d="M0 388 Q150 305 275 350 T460 335 V460 H0 Z" fill="url(#hillA)"/>

  <!-- 草尖（青意） -->
  <g stroke="#8FE3C0" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M120 355 q-6 -26 4 -46"/>
    <path d="M138 360 q2 -30 16 -48"/>
    <path d="M330 348 q6 -26 -2 -46"/>
    <path d="M312 352 q-4 -24 -18 -40"/>
  </g>
</svg>
